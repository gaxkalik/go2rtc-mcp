# Smithery configuration file
# See https://smithery.ai/docs/config for configuration details.

startCommand:
  type: stdio
  configSchema:
    type: object
    properties:
      go2rtcUrl:
        type: string
        title: "go2rtc URL"
        description: "Base HTTP URL of your go2rtc server"
        default: "http://localhost:1984"
      go2rtcUsername:
        type: string
        title: "Username"
        description: "Optional HTTP Basic Auth username for go2rtc"
        default: ""
      go2rtcPassword:
        type: string
        title: "Password"
        description: "Optional HTTP Basic Auth password for go2rtc"
        default: ""
      go2rtcTimeout:
        type: number
        title: "Timeout (seconds)"
        description: "HTTP request timeout in seconds"
        default: 15.0
      go2rtcAllowExecStreams:
        type: boolean
        title: "Allow Exec Streams"
        description: "Whether to allow adding or updating exec:, echo:, or expr: stream sources"
        default: false

  commandFunction: |-
    (config) => ({
      command: "uvx",
      args: [
        "--from",
        "git+https://github.com/gaxkalik/go2rtc-mcp.git",
        "go2rtc-mcp"
      ],
      env: {
        GO2RTC_URL: config.go2rtcUrl || "http://localhost:1984",
        GO2RTC_USERNAME: config.go2rtcUsername || "",
        GO2RTC_PASSWORD: config.go2rtcPassword || "",
        GO2RTC_TIMEOUT: String(config.go2rtcTimeout || 15.0),
        GO2RTC_ALLOW_EXEC_STREAMS: String(Boolean(config.go2rtcAllowExecStreams))
      }
    })

  exampleConfig:
    go2rtcUrl: "http://localhost:1984"
    go2rtcUsername: ""
    go2rtcPassword: ""
    go2rtcTimeout: 15.0
    go2rtcAllowExecStreams: false
