[project]
name = "go2rtc-mcp"
version = "0.1.0"
description = "Production-grade Model Context Protocol (MCP) server for go2rtc streaming servers"
readme = "README.md"
license = "MIT"
authors = [
    { name = "Armen", email = "gaxkalik@gmail.com" }
]
requires-python = ">=3.11"

[project.urls]
Homepage = "https://github.com/gaxkalik/go2rtc-mcp"
Repository = "https://github.com/gaxkalik/go2rtc-mcp"
Issues = "https://github.com/gaxkalik/go2rtc-mcp/issues"
dependencies = [
    "httpx>=0.28.1",
    "mcp[cli]>=1.2.0",
    "pydantic>=2.10.0",
    "python-dotenv>=1.0.1",
    "pyyaml>=6.0.2",
]

[project.scripts]
go2rtc-mcp = "go2rtc_mcp.server:main"

[build-system]
requires = ["uv_build>=0.13.1,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "respx>=0.22.0",
    "ruff>=0.9.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
